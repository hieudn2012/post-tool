<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
  <link rel="stylesheet" href="output.css">
</head>

<body>
  <div class="flex flex-col justify-between h-[100vh] p-4">

    <div class="grid grid-cols-2 gap-2 text-sm">
      <div class="flex flex-col gap-2 justify-center items-center">
        <div class="flex gap-2 mb-5 w-full items-center">
          <input type="text" class="border border-gray-300 rounded-lg p-2 w-full" id="working-folder"
            placeholder="Nhập thư mục làm việc">
          <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-medium p-2 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
            id="open-working-folder">
            <i class="fa-solid fa-folder"></i>
          </button>
        </div>
        <button
          class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="open-random-folder-btn">
          <i class="fa-solid fa-folder"></i>
          <p>Mở thư mục ngẫu nhiên</p>
        </button>

        <button
          class="bg-yellow-500 hover:bg-yellow-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="create-empty-folder">
          <i class="fa-solid fa-folder-plus"></i>
          <p>Tạo thư mục rỗng</p>
        </button>

        <button
          class="bg-red-500 hover:bg-red-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="delete-empty-folder">
          <i class="fa-solid fa-folder-minus"></i>
          <p>Xoá tất cả thư mục rỗng</p>
        </button>

        <button
          class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="open-empty-folder">
          <i class="fa-solid fa-folder-minus"></i>
          <p>Mở thư mục rỗng</p>
        </button>

        <div class="my-5 w-full border-b border-gray-200"></div>

        <div class="w-full flex gap-2">
          <input type="text" class="border border-gray-300 rounded-lg p-2 w-full mb-1" id="post-link"
            placeholder="Nhập Link bài viết" />
          <input type="text" class="border border-gray-300 rounded-lg p-2 w-[80px] mb-1" id="total-post"
            placeholder="Nhập số lượng" type="number" />
        </div>
        <button
          class="bg-purple-500 hover:bg-purple-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="assign-random-id-to-post">
          <i class="fa-solid fa-folder-minus"></i>
          <p>Gáng ID cho bài viết</p>
        </button>

        <textarea type="text" class="border border-gray-300 rounded-lg p-2 w-full h-24" id="list-captions"
          placeholder="Nhập danh sách captions"></textarea>
        <button
          class="bg-green-500 hover:bg-green-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="open-random-caption">
          <i class="fa-solid fa-copy"></i>
          <p>Lấy caption ngẫu nhiên</p>
        </button>

        <textarea class="border border-gray-300 rounded-lg p-2 w-full h-24" id="comment-template"
          placeholder="Nhập comment mẫu"></textarea>

        <textarea class="border border-gray-300 rounded-lg p-2 w-full h-24" id="list-links"
          placeholder="Danh sách links"></textarea>

        <button
          class="bg-green-500 hover:bg-green-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="get-random-comment">
          <i class="fa-solid fa-copy"></i>
          <p>Lấy comment</p>
        </button>


        <div class="my-5 w-full border-b border-gray-200"></div>

        <input type="text" class="border border-gray-300 rounded-lg p-2 w-full mb-1" id="thread-link"
          placeholder="https://www.threads.net/@anmabs20" />
        <div class="w-full flex items-center gap-2">
          <input type="text" class="border border-gray-300 rounded-lg p-2 w-full" id="folder-save-files"
            placeholder="Nhập thư mục lưu" />
          <button
            class="bg-purple-500 hover:bg-purple-700 text-white font-medium p-2 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
            id="change-folder-save-files">
            <i class="fa-solid fa-folder"></i>
          </button>
        </div>
        <button
          class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="crawl-data">
          <i class="fa-solid fa-folder"></i>
          <p>Crawl data</p>
        </button>
      </div>

      <div>
        <div class="flex flex-col justify-center items-center gap-2">
          <div class="flex gap-2 mb-5 w-full items-center">
            <input type="text" class="border border-gray-300 rounded-lg p-2 w-full" id="comment-folder"
              placeholder="Nhập thư mục lưu ảnh/video comment">
            <button
              class="bg-blue-500 hover:bg-blue-700 text-white font-medium p-2 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
              id="open-working-comment-folder">
              <i class="fa-solid fa-folder"></i>
            </button>
          </div>
          <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
            id="open-random-comment-folder-btn">
            <i class="fa-solid fa-folder"></i>
            <p>Mở thư mục ngẫu nhiên</p>
          </button>

          <button
            class="bg-yellow-500 hover:bg-yellow-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
            id="create-empty-comment-folder">
            <i class="fa-solid fa-folder-plus"></i>
            <p>Tạo thư mục rỗng</p>
          </button>

          <button
            class="bg-red-500 hover:bg-red-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
            id="delete-empty-comment-folder">
            <i class="fa-solid fa-folder-minus"></i>
            <p>Xoá tất cả thư mục rỗng</p>
          </button>

          <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
            id="open-empty-comment-folder">
            <i class="fa-solid fa-folder-minus"></i>
            <p>Mở thư mục rỗng</p>
          </button>
        </div>

        <div class="pt-10">
          <p class="text-center text-sm text-green-500" id="status-message"></p>
        </div>

      </div>

    </div>

    <div class="pt-5">
      <div class="flex justify-end">
        <button
          class="bg-blue-500 hover:bg-blue-700 text-white font-medium p-2 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
          id="save-config">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </div>
  <script>
    // add event listener to open button
    const openRandomFolderButton = document.getElementById(`open-random-folder-btn`);
    openRandomFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.openRandomFolder(folderPath);
    });

    // add event listener to copy button
    const openRandomCaptionButton = document.getElementById(`open-random-caption`);
    openRandomCaptionButton.addEventListener('click', async () => {
      await window.electronAPI.copyRandomCaption();
    });

    // add event listener to create empty folder button
    const createEmptyFolderButton = document.getElementById(`create-empty-folder`);
    createEmptyFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.createEmptyFolder(folderPath);
    });

    // add event listener to delete empty folder button
    const deleteEmptyFolderButton = document.getElementById(`delete-empty-folder`);
    deleteEmptyFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.deleteEmptyFolder(folderPath);
    });

    // add event listener to open empty folder button
    const openEmptyFolderButton = document.getElementById(`open-empty-folder`);
    openEmptyFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.openEmptyFolder(folderPath);
    });

    // add event listener to assign random id button
    const assignRandomIdButton = document.getElementById(`assign-random-id-to-post`);
    assignRandomIdButton.addEventListener('click', async () => {
      const url = document.getElementById(`post-link`).value;
      const total = document.getElementById(`total-post`).value || 0;
      await window.electronAPI.assignRandomIdToPost({ url, total: Number(total) });
    });

    // add event listener to crawl data button
    const crawlDataButton = document.getElementById(`crawl-data`);
    crawlDataButton.addEventListener('click', async () => {
      await window.electronAPI.crawlData();
    });

    // add event listener to open working folder button
    const openWorkingFolderButton = document.getElementById(`open-working-folder`);
    openWorkingFolderButton.addEventListener('click', async () => {
      await window.electronAPI.openWorkingFolder();
    });

    // add event listener to open working comment folder button
    const openWorkingCommentFolderButton = document.getElementById(`open-working-comment-folder`);
    openWorkingCommentFolderButton.addEventListener('click', async () => {
      await window.electronAPI.openWorkingCommentFolder();
    });


    // add event listener to save config button
    const saveConfigButton = document.getElementById(`save-config`);
    saveConfigButton.addEventListener('click', async () => {
      await window.electronAPI.saveConfig({
        workingFolder: document.getElementById(`working-folder`).value,
        postLink: document.getElementById(`post-link`).value,
        threads: document.getElementById(`thread-link`).value,
        saveFolder: document.getElementById(`folder-save-files`).value,
        links: document.getElementById(`list-links`).value,
        commentTemplate: document.getElementById(`comment-template`).value,
        captions: document.getElementById(`list-captions`).value,
        commentFolder: document.getElementById(`comment-folder`).value,
      });
    });

    // add event listener to change folder save files button
    const changeFolderSaveFilesButton = document.getElementById(`change-folder-save-files`);
    changeFolderSaveFilesButton.addEventListener('click', async () => {
      await window.electronAPI.changeFolderSaveFiles();
    });

    // add event listener to get random comment button
    const getRandomCommentButton = document.getElementById(`get-random-comment`);
    getRandomCommentButton.addEventListener('click', async () => {
      const links = document.getElementById(`list-links`).value;
      await window.electronAPI.getRandomComment(links);
    });

    // add event listener to open random comment folder button
    const openRandomCommentFolderButton = document.getElementById(`open-random-comment-folder-btn`);
    openRandomCommentFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`comment-folder`).value;
      await window.electronAPI.openRandomFolder(folderPath);
    });

    // add event listener to create empty comment folder button
    const createEmptyCommentFolderButton = document.getElementById(`create-empty-comment-folder`);
    createEmptyCommentFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`comment-folder`).value;
      await window.electronAPI.createEmptyFolder(folderPath);
    });

    // add event listener to delete empty comment folder button
    const deleteEmptyCommentFolderButton = document.getElementById(`delete-empty-comment-folder`);
    deleteEmptyCommentFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`comment-folder`).value;
      await window.electronAPI.deleteEmptyFolder(folderPath);
    });

    // add event listener to open empty comment folder button
    const openEmptyCommentFolderButton = document.getElementById(`open-empty-comment-folder`);
    openEmptyCommentFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`comment-folder`).value;
      await window.electronAPI.openEmptyFolder(folderPath);
    });

    window.electronAPI.onActionResult(async ({ eventMessage, path, type, ...data }) => {
      const status = document.getElementById(`status-message`);

      if (eventMessage) {
        status.textContent = eventMessage;
      }

      if (type === 'CHANGE_WORKING_FOLDER') {
        document.getElementById(`working-folder`).value = path;
      }

      if (type === 'CHANGE_FOLDER_SAVE_FILES') {
        document.getElementById(`folder-save-files`).value = path;
      }

      if (type === 'LOAD_CONFIG') {
        document.getElementById(`working-folder`).value = data.workingFolder || '';
        document.getElementById(`comment-folder`).value = data.commentFolder || '';
        document.getElementById(`post-link`).value = data.postLink || '';
        document.getElementById(`thread-link`).value = data.threads || '';
        document.getElementById(`folder-save-files`).value = data.saveFolder || '';
        document.getElementById(`list-links`).value = data.links || '';
        document.getElementById(`comment-template`).value = data.commentTemplate || '';
        document.getElementById(`list-captions`).value = data.captions || '';
      }

      if (type === 'CHANGE_LINKS') {
        document.getElementById(`list-links`).value = data.links;
      }
    });

    window.electronAPI.loadConfig();
  </script>
</body>

</html>
