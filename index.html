<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto login and post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
  <link rel="stylesheet" href="output.css">
</head>

<body>
  <div class="flex flex-col justify-between h-[100vh] p-4">
    <div class="flex flex-col gap-2 justify-center items-center text-sm">
      <input type="text" class="border border-gray-300 rounded-lg p-2 w-full" id="working-folder"
        placeholder="Nhập thư mục làm việc">
      <button
        class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
        id="open-random-folder-btn">
        <i class="fa-solid fa-folder"></i>
        <p>Mở thư mục ngẫu nhiên</p>
      </button>

      <button
        class="bg-yellow-500 hover:bg-yellow-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
        id="create-empty-folder">
        <i class="fa-solid fa-folder-plus"></i>
        <p>Tạo thư mục rỗng</p>
      </button>

      <button
        class="bg-red-500 hover:bg-red-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
        id="delete-empty-folder">
        <i class="fa-solid fa-folder-minus"></i>
        <p>Xoá tất cả thư mục rỗng</p>
      </button>

      <button
        class="bg-blue-500 hover:bg-blue-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
        id="open-empty-folder">
        <i class="fa-solid fa-folder-minus"></i>
        <p>Mở thư mục rỗng</p>
      </button>

      <div class="my-5 w-full border-b border-gray-200"></div>

      <input type="text" class="border border-gray-300 rounded-lg p-2 w-full mb-1" id="post-link"
        placeholder="Nhập Link bài viết" />
      <button
        class="bg-purple-500 hover:bg-purple-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
        id="assign-random-id-to-post">
        <i class="fa-solid fa-folder-minus"></i>
        <p>Gáng ID cho bài viết</p>
      </button>

      <button
        class="bg-green-500 hover:bg-green-700 text-white font-medium py-1 px-4 rounded-lg items-center gap-2 flex-shrink-0 flex justify-center"
        id="open-random-caption">
        <i class="fa-solid fa-copy"></i>
        <p>Lấy caption</p>
      </button>

    </div>

    <div>
      <p class="text-center text-sm text-green-500" id="status-message"></p>
    </div>
  </div>
  <script>
    // add event listener to open button
    const openRandomFolderButton = document.getElementById(`open-random-folder-btn`);
    openRandomFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.openRandomFolder(folderPath);
    });

    // add event listener to copy button
    const openRandomCaptionButton = document.getElementById(`open-random-caption`);
    openRandomCaptionButton.addEventListener('click', async () => {
      await window.electronAPI.copyRandomCaption();
    });

    // add event listener to create empty folder button
    const createEmptyFolderButton = document.getElementById(`create-empty-folder`);
    createEmptyFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.createEmptyFolder(folderPath);
    });

    // add event listener to delete empty folder button
    const deleteEmptyFolderButton = document.getElementById(`delete-empty-folder`);
    deleteEmptyFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.deleteEmptyFolder(folderPath);
    });

    // add event listener to open empty folder button
    const openEmptyFolderButton = document.getElementById(`open-empty-folder`);
    openEmptyFolderButton.addEventListener('click', async () => {
      const folderPath = document.getElementById(`working-folder`).value;
      await window.electronAPI.openEmptyFolder(folderPath);
    });

    // add event listener to assign random id button
    const assignRandomIdButton = document.getElementById(`assign-random-id-to-post`);
    assignRandomIdButton.addEventListener('click', async () => {
      const url = document.getElementById(`post-link`).value;
      await window.electronAPI.assignRandomIdToPost(url);
    });

    window.electronAPI.onActionResult(async ({ eventMessage }) => {
      const status = document.getElementById(`status-message`);
      if (eventMessage) {
        status.textContent = eventMessage;
      }
    });
  </script>
</body>

</html>
